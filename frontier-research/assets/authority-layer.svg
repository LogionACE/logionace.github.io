<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title>Proposed AI Authority Layer</title>
  <desc>A principal delegates to an agent identity. The AI Authority Layer evaluates delegation, intent, scope, context, time, policy, and risk before a decision reaches a tool, data source, or action. Evidence is emitted with the decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="authority" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#305fdb"/>
      <stop offset="1" stop-color="#6f8cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7995d8"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="64" y="58" fill="#8fa3d9" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2.5">CONCEPTUAL FLOW / NOT A PROTOCOL SPECIFICATION</text>

  <g filter="url(#shadow)">
    <rect x="64" y="116" width="190" height="112" rx="18" fill="#101b2d" stroke="#334766"/>
    <text x="159" y="156" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Principal</text>
    <text x="159" y="184" text-anchor="middle" fill="#9aa8be" font-family="Inter,Arial,sans-serif" font-size="14">Human or organization</text>
    <text x="159" y="207" text-anchor="middle" fill="#6f8cff" font-family="Inter,Arial,sans-serif" font-size="12">delegates bounded authority</text>

    <rect x="318" y="116" width="190" height="112" rx="18" fill="#101b2d" stroke="#334766"/>
    <text x="413" y="156" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Agent Identity</text>
    <text x="413" y="184" text-anchor="middle" fill="#9aa8be" font-family="Inter,Arial,sans-serif" font-size="14">Authenticated actor</text>
    <text x="413" y="207" text-anchor="middle" fill="#6f8cff" font-family="Inter,Arial,sans-serif" font-size="12">distinct from principal</text>

    <rect x="572" y="96" width="282" height="152" rx="22" fill="url(#authority)" stroke="#9eb0ff"/>
    <text x="713" y="143" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800">AI Authority Layer</text>
    <text x="713" y="172" text-anchor="middle" fill="#e9edff" font-family="Inter,Arial,sans-serif" font-size="13">Identity / Principal / Delegation / Intent</text>
    <text x="713" y="195" text-anchor="middle" fill="#e9edff" font-family="Inter,Arial,sans-serif" font-size="13">Scope / Context / Time / Policy / Risk</text>
    <text x="713" y="224" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">Trust Layer decision + evidence</text>

    <rect x="918" y="116" width="218" height="112" rx="18" fill="#101b2d" stroke="#334766"/>
    <text x="1027" y="156" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Tool / Data / Action</text>
    <text x="1027" y="184" text-anchor="middle" fill="#9aa8be" font-family="Inter,Arial,sans-serif" font-size="14">Enforcement boundary</text>
    <text x="1027" y="207" text-anchor="middle" fill="#6f8cff" font-family="Inter,Arial,sans-serif" font-size="12">requested execution</text>
  </g>

  <path d="M254 172 H306" stroke="#7995d8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M508 172 H560" stroke="#7995d8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M854 172 H906" stroke="#7995d8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="344" y="318" width="512" height="122" rx="20" fill="#0a1425" stroke="#2c436a"/>
  <text x="380" y="354" fill="#8fa3d9" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">DECISION VOCABULARY</text>
  <g font-family="JetBrains Mono,monospace" font-size="13" font-weight="700">
    <rect x="380" y="376" width="88" height="34" rx="17" fill="#163f34" stroke="#2a936f"/>
    <text x="424" y="398" text-anchor="middle" fill="#72e0b8">ALLOW</text>
    <rect x="482" y="376" width="82" height="34" rx="17" fill="#48272c" stroke="#a94d59"/>
    <text x="523" y="398" text-anchor="middle" fill="#ff9ca8">DENY</text>
    <rect x="578" y="376" width="104" height="34" rx="17" fill="#493918" stroke="#a9822c"/>
    <text x="630" y="398" text-anchor="middle" fill="#f5ca6b">STEP_UP</text>
    <rect x="696" y="376" width="126" height="34" rx="17" fill="#2d3152" stroke="#606bb2"/>
    <text x="759" y="398" text-anchor="middle" fill="#bdc5ff">HUMAN_REQUIRED</text>
  </g>
  <path d="M713 248 V304" stroke="#7995d8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="734" y="282" fill="#9aa8be" font-family="Inter,Arial,sans-serif" font-size="12">signed decision receipt</text>
  <text x="600" y="470" text-anchor="middle" fill="#8fa3d9" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">CONCEPTUAL MODEL / NOT A MATHEMATICAL MODEL</text>
  <text x="600" y="496" text-anchor="middle" fill="#f5f7fb" font-family="JetBrains Mono,monospace" font-size="14" font-weight="700">Effective Authority = f(Identity, Principal, Delegation, Intent, Scope, Context, Time, Policy, Risk)</text>
</svg>
